[project]
name = "finance-assistant"
version = "0.1.0"
description = "AI finance tutor: multi-agent educational assistant (course project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.8",
    "httpx>=0.27",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langgraph>=1.2",
    "numpy>=1.26",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "sentence-transformers>=3.0",
    # Direct so [tool.uv.sources] can route it to the CPU-only wheels on Linux.
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

# CPU-only torch on Linux (the Docker image); macOS wheels from PyPI are already CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not live"'
markers = [
    "live: calls the real OpenAI API; opt in with `-m live` (needs OPENAI_API_KEY)",
]
